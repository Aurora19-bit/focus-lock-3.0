name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare & Unpack Project
        run: |
          # 1. Automatically extract the uploaded zip archive if present
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \;

          # 2. Fix animation references in MainActivity.kt
          find app/src/main/java -name "MainActivity.kt" -exec sed -i 's/R\.anim\.butterfly_float/R\.anim\.ocean_float/g' {} + 2>/dev/null || true
          find app/src/main/java -name "MainActivity.kt" -exec sed -i 's/R\.anim\.sparkle_pulse/R\.anim\.bioluminescent_pulse/g' {} + 2>/dev/null || true

          # 3. Fix TextView textColor method in MainActivity.kt
          find app/src/main/java -name "MainActivity.kt" -exec sed -i 's/textColor = 0xFF94A3B8\.toInt()/setTextColor(0xFF94A3B8\.toInt())/g' {} + 2>/dev/null || true
          find app/src/main/java -name "MainActivity.kt" -exec sed -i 's/textColor =/setTextColor(/g' {} + 2>/dev/null || true

          # 4. Create fallback animation XMLs to guarantee zero compile errors
          mkdir -p app/src/main/res/anim
          cat << 'EOF' > app/src/main/res/anim/butterfly_float.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <translate android:fromYDelta="0" android:toYDelta="-10dp" android:duration="1000" />
          </set>
          EOF

          cat << 'EOF' > app/src/main/res/anim/sparkle_pulse.xml
          <?xml version="1.0" encoding="utf-8"?>
          <set xmlns:android="http://schemas.android.com/apk/res/android">
              <scale android:fromXScale="0.9" android:toXScale="1.1" android:fromYScale="0.9" android:toYScale="1.1" android:pivotX="50%" android:pivotY="50%" android:duration="800" />
          </set>
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Ocean Sanctuary APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-v3.6.0-DeepOceanSanctuary-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
